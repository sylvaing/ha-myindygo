[project]
name = "ha-myindygo"
version = "0.1.0"
description = "Unofficial Home Assistant integration for Solem MyIndygo pool equipment"
requires-python = ">=3.14"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
